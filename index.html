<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAPMI Class Tracker</title><meta name="theme-color" content="#0b1020"><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#687386;--line:#e5e9f0;--accent:#1f6feb;--ok:#14804a;--bad:#c62828}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}header{background:#0b1020;color:#fff;padding:18px 22px;position:sticky;top:0;z-index:10}.bar,.wrap{max-width:1180px;margin:auto}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800}.sub{font-size:12px;color:#b8c2d5;margin-top:3px}.wrap{padding:24px 16px}button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}button.primary{background:var(--accent);color:#fff}button.ghost{background:#eef3fb;color:#244}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 18px #14213d08}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{font-size:28px;font-weight:800}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button.active{background:#0b1020;color:#fff}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.class{border-left:5px solid var(--accent);margin:10px 0;padding:13px 14px;background:#fff;border-radius:12px;border:1px solid var(--line)}.class.present{border-left-color:var(--ok)}.class.absent{border-left-color:var(--bad)}.time{font-weight:800}.status{font-size:12px;font-weight:800}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#f7f9fc}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.login{max-width:430px;margin:70px auto}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #ccd3df;border-radius:10px;font:inherit}.notice,.err{padding:12px;border-radius:10px;margin:12px 0}.notice{background:#fff7df;color:#775500}.err{background:#fff0f0;color:#a11}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header><div class="bar"><div><div class="brand">TAPMI Class Tracker</div><div class="sub">MBA-AI&DS (2025–2027) • Term 5</div></div><div id="account"></div></div></header>
<main class="wrap">
<section id="login" class="login card"><h2>Batch login</h2><p class="muted">Use your Manipal learner email and your Supabase password.</p><div id="loginErr" class="err hidden"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="primary" onclick="doLogin()">Sign in</button></section>
<section id="app" class="hidden"><div id="welcome" class="card"></div><div class="tabs"><button id="dashBtn" class="active" onclick="tab('dash')">Dashboard</button><button onclick="tab('today')">Today's classes</button><button onclick="tab('attendance')">Batch attendance</button><button id="adminBtn" class="hidden" onclick="tab('admin')">Admin</button><button class="ghost" onclick="doLogout()">Sign out</button></div><div id="dash"></div><div id="today" class="hidden"></div><div id="attendance" class="hidden"></div><div id="admin" class="hidden"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(TAPMI_CONFIG.supabaseUrl,TAPMI_CONFIG.supabasePublishableKey);let me,profile,subjects=[],classes=[],mine=[],profiles=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const att=id=>mine.find(x=>x.class_id===id);
async function doLogin(){loginErr.classList.add("hidden");let r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error){loginErr.textContent=r.error.message;loginErr.classList.remove("hidden");return}await boot()}
async function doLogout(){await sb.auth.signOut();location.reload()}
async function boot(){let u=await sb.auth.getUser();me=u.data.user;if(!me)return;let p=await sb.from("profiles").select("*").eq("id",me.id).single();if(p.error){loginErr.textContent="Login works, but your profile is not linked. Contact an admin.";loginErr.classList.remove("hidden");return}profile=p.data;login.classList.add("hidden");app.classList.remove("hidden");account.textContent=profile.full_name+" · "+profile.role;if(profile.role==="admin")adminBtn.classList.remove("hidden");await load();render()}
async function load(){let [s,c,a]=await Promise.all([sb.from("subjects").select("*").order("name"),sb.from("classes").select("*,subjects(name,credits)").order("class_date").order("start_time"),sb.from("attendance").select("*").eq("student_id",me.id)]);if(s.error||c.error||a.error){alert((s.error||c.error||a.error).message);return}subjects=s.data||[];classes=c.data||[];mine=a.data||[];if(profile.role==="admin"){let p=await sb.from("profiles").select("student_id,full_name,email,role").order("student_id");profiles=p.data||[]}}
function tab(x){["dash","today","attendance","admin"].forEach(y=>document.getElementById(y).classList.toggle("hidden",x!==y));document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));if(x==="dash")dashBtn.classList.add("active")}
function render(){welcome.innerHTML='<div class="row"><div><h2 style="margin:0">Hi, '+esc(profile.full_name.split(" ")[0])+' 👋</h2><div class="muted">'+esc(profile.student_id)+' · '+esc(profile.email)+'</div></div><b>'+profile.role.toUpperCase()+'</b></div>';renderDash();renderToday();renderAttendance();if(profile.role==="admin")renderAdmin()}
function renderDash(){dash.innerHTML='<h3>My attendance</h3><div class="grid">'+subjects.map(s=>{let cs=classes.filter(c=>c.subject_id===s.id),p=cs.filter(c=>att(c.id)?.status==="present").length,a=cs.filter(c=>att(c.id)?.status==="absent").length,allow=s.skip_allowance??s.credits;return '<div class="card"><b>'+esc(s.name)+'</b><div class="muted">'+s.credits+' credits</div><div class="stat">'+p+'/'+(p+a)+'</div><div class="muted">'+Math.max(0,allow-a)+' skip(s) remaining</div></div>'}).join("")+'</div>'}
function classCard(c){let a=att(c.id),st=a?.status;return '<div class="class '+(st||"")+'"><div class="row"><div><div class="time">'+c.class_date+' · '+c.start_time.slice(0,5)+'–'+c.end_time.slice(0,5)+'</div><b>'+esc(c.subjects?.name||"Class")+'</b><div class="muted">Room: '+esc(c.room||"—")+' · Session '+(c.session_number||"—")+'</div>'+(st?'<div class="status '+(st==="present"?"ok":"bad")+'">'+st.toUpperCase()+'</div>':"")+'</div><button class="'+(st?"ghost":"primary")+'" onclick="mark(\''+c.id+'\',\''+(st==="present"?"absent":"present")+'\')">'+(st==="present"?"Mark absent":"I attended")+'</button></div></div>'}
function renderToday(){
  const todayDate = new Date();
  const year = todayDate.getFullYear();
  const month = String(todayDate.getMonth() + 1).padStart(2,"0");
  const day = String(todayDate.getDate()).padStart(2,"0");
  const dateString = `${year}-${month}-${day}`;

  const todayClasses = classes.filter(
    c => String(c.class_date).slice(0,10) === dateString
  );

  const todaySection = document.getElementById("today");

  todaySection.innerHTML =
    '<h3>Today’s classes</h3>' +
    (
      todayClasses.length
      ? todayClasses.map(classCard).join("")
      : '<div class="card"><b>No scheduled classes today.</b></div>'
    );
}function renderAttendance(){let rows=subjects.map(s=>{let cs=classes.filter(c=>c.subject_id===s.id),p=cs.filter(c=>att(c.id)?.status==="present").length,a=cs.filter(c=>att(c.id)?.status==="absent").length;return '<tr><td><b>'+esc(s.name)+'</b></td><td>'+p+'</td><td>'+a+'</td><td>'+((p+a)?Math.round(p/(p+a)*100):0)+'%</td><td>'+Math.max(0,(s.skip_allowance??s.credits)-a)+'</td></tr>'}).join("");attendance.innerHTML='<h3>My attendance summary</h3><div class="tablewrap"><table><thead><tr><th>Subject</th><th>Present</th><th>Absent</th><th>%</th><th>Skips left</th></tr></thead><tbody>'+rows+'</tbody></table></div><h3 style="margin-top:24px">Batch attendance</h3><div id="batch" class="card">Loading…</div>';loadBatch()}
async function loadBatch(){let q=await sb.from("batch_attendance").select("*").order("student_id");if(q.error){batch.innerHTML='<div class="notice">Batch view needs the SQL patch to be run first.</div>';return}let g={};(q.data||[]).forEach(r=>(g[r.student_id]??=[]).push(r));let rows=Object.entries(g).map(([id,rs])=>{let p=rs.filter(x=>x.status==="present").length,a=rs.filter(x=>x.status==="absent").length,pc=p+a?Math.round(p/(p+a)*100):0;return '<tr><td>'+esc(id)+'</td><td>'+esc(rs[0].full_name)+'</td><td>'+p+'</td><td>'+a+'</td><td>'+pc+'%</td></tr>'}).join("");batch.innerHTML='<div class="tablewrap"><table><thead><tr><th>ID</th><th>Student</th><th>Present</th><th>Absent</th><th>%</th></tr></thead><tbody>'+rows+'</tbody></table></div>'}
async function mark(classId,status){let q=await sb.from("attendance").upsert({student_id:me.id,class_id:classId,status,marked_at:new Date().toISOString()},{onConflict:"student_id,class_id"});if(q.error){alert(q.error.message);return}await load();render();tab("today")}
function renderAdmin(){admin.innerHTML='<h3>Admin dashboard</h3><div class="grid"><div class="card"><div class="stat">'+profiles.length+'</div><div class="muted">Batch profiles</div></div><div class="card"><div class="stat">'+classes.length+'</div><div class="muted">Classes</div></div><div class="card"><div class="stat">'+subjects.length+'</div><div class="muted">Subjects</div></div></div><div class="card" style="margin-top:16px"><h3>Batch members</h3><div class="tablewrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>'+profiles.map(p=>'<tr><td>'+esc(p.student_id)+'</td><td>'+esc(p.full_name)+'</td><td>'+esc(p.email)+'</td><td>'+esc(p.role)+'</td></tr>').join("")+'</tbody></table></div></div><div class="notice">Admin timetable editing will be enabled in the next module after we verify the login and attendance flow.</div>'}
(async()=>{let s=await sb.auth.getSession();if(s.data.session)await boot()})();</script></body></html>
