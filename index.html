<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAPMI Class Tracker</title>
<meta name="theme-color" content="#0b1020">

<style>
:root{
--bg:#f5f7fb;
--card:#fff;
--ink:#172033;
--muted:#687386;
--line:#e5e9f0;
--accent:#1f6feb;
--ok:#14804a;
--bad:#c62828
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
background:var(--bg);
color:var(--ink)
}

header{
background:#0b1020;
color:#fff;
padding:18px 22px;
position:sticky;
top:0;
z-index:10
}

.bar,.wrap{
max-width:1180px;
margin:auto
}

.bar{
display:flex;
align-items:center;
justify-content:space-between;
gap:16px
}

.brand{font-weight:800}

.sub{
font-size:12px;
color:#b8c2d5;
margin-top:3px
}

.wrap{padding:24px 16px}

button{
border:0;
border-radius:10px;
padding:10px 14px;
font-weight:700;
cursor:pointer
}

button.primary{
background:var(--accent);
color:#fff
}

button.ghost{
background:#eef3fb;
color:#244
}

button.danger{
background:#fff0f0;
color:#b11
}

button.small{
padding:7px 10px;
font-size:12px
}

.card{
background:#fff;
border:1px solid var(--line);
border-radius:16px;
padding:18px;
box-shadow:0 5px 18px #14213d08
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px
}

.stat{
font-size:28px;
font-weight:800
}

.muted{color:var(--muted)}

.tabs{
display:flex;
gap:8px;
flex-wrap:wrap;
margin:18px 0
}

.tabs button.active{
background:#0b1020;
color:#fff
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px
}

.class{
border-left:5px solid var(--accent);
margin:10px 0;
padding:13px 14px;
background:#fff;
border-radius:12px;
border:1px solid var(--line)
}

.class.present{border-left-color:var(--ok)}
.class.absent{border-left-color:var(--bad)}

.time{font-weight:800}

.status{
font-size:12px;
font-weight:800
}

.status.ok{color:var(--ok)}
.status.bad{color:var(--bad)}

table{
width:100%;
border-collapse:collapse;
background:#fff
}

th,td{
padding:10px;
border-bottom:1px solid var(--line);
text-align:left;
font-size:14px
}

th{background:#f7f9fc}

.tablewrap{
overflow:auto;
border:1px solid var(--line);
border-radius:12px
}

.login{
max-width:430px;
margin:70px auto
}

.field{margin:12px 0}

.field label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:6px
}

.field input,
.field select,
.field textarea{
width:100%;
padding:11px;
border:1px solid #ccd3df;
border-radius:10px;
font:inherit
}

.field textarea{
min-height:100px;
resize:vertical
}

.notice,.err,.success{
padding:12px;
border-radius:10px;
margin:12px 0
}

.notice{
background:#fff7df;
color:#775500
}

.err{
background:#fff0f0;
color:#a11
}

.success{
background:#edfff5;
color:#12633c
}

.hidden{display:none!important}

.adminnav{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:16px
}

.adminnav button.active{
background:#0b1020;
color:#fff
}

.formgrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px
}

.formgrid .wide{
grid-column:span 2
}

.section{
margin-top:18px
}

.event{
border-left:5px solid #7c4dff;
margin:10px 0;
padding:14px;
background:#fff;
border-radius:12px;
border:1px solid var(--line)
}

.announcement{
border-left:5px solid #ff9800;
margin:10px 0;
padding:14px;
background:#fff;
border-radius:12px;
border:1px solid var(--line)
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:999px;
font-size:11px;
font-weight:800;
background:#eef3fb
}

@media(max-width:800px){
.grid,.formgrid{
grid-template-columns:1fr
}

.formgrid .wide{
grid-column:span 1
}

.row{
align-items:flex-start;
flex-direction:column
}
}
</style>
</head>

<body>

<header>
<div class="bar">

<div>
<div class="brand">TAPMI Class Tracker</div>
<div class="sub">MBA-AI&DS (2025–2027) • Term 5</div>
</div>

<div id="account"></div>

</div>
</header>


<main class="wrap">

<section id="login" class="login card">

<h2>Batch login</h2>

<p class="muted">
Use your Manipal learner email and your Supabase password.
</p>

<div id="loginErr" class="err hidden"></div>

<div class="field">
<label>Email</label>
<input id="email" type="email">
</div>

<div class="field">
<label>Password</label>
<input id="password" type="password">
</div>

<button class="primary" onclick="doLogin()">Sign in</button>

</section>


<section id="app" class="hidden">

<div id="welcome" class="card"></div>


<div class="tabs">

<button id="dashBtn" class="active" onclick="tab('dash')">
Dashboard
</button>

<button onclick="tab('today')">
Today's classes
</button>

<button onclick="tab('attendance')">
Batch attendance
</button>

<button onclick="tab('events')">
Events
</button>

<button onclick="tab('announcements')">
Announcements
</button>

<button id="adminBtn" class="hidden" onclick="tab('admin')">
Admin
</button>

<button class="ghost" onclick="doLogout()">
Sign out
</button>

</div>


<div id="dash"></div>

<div id="today" class="hidden"></div>

<div id="attendance" class="hidden"></div>

<div id="events" class="hidden"></div>

<div id="announcements" class="hidden"></div>

<div id="admin" class="hidden"></div>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

const sb=supabase.createClient(
TAPMI_CONFIG.supabaseUrl,
TAPMI_CONFIG.supabasePublishableKey
);


let me;
let profile;

let subjects=[];
let classes=[];
let mine=[];
let profiles=[];

let eventsData=[];
let announcementsData=[];

let adminSection="students";
let editingClassId=null;
let editingEventId=null;
let selectedClassDate=new Date();

const esc=s=>String(s??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);


const att=id=>mine.find(
x=>x.class_id===id
);


/* LOGIN */

async function doLogin(){

loginErr.classList.add("hidden");

let r=await sb.auth.signInWithPassword({
email:email.value.trim(),
password:password.value
});

if(r.error){

loginErr.textContent=r.error.message;

loginErr.classList.remove("hidden");

return;
}

await boot();

}


async function doLogout(){

await sb.auth.signOut();

location.reload();

}


/* BOOT */

async function boot(){

let u=await sb.auth.getUser();

me=u.data.user;

if(!me)return;


let p=await sb.from("profiles")
.select("*")
.eq("id",me.id)
.single();


if(p.error){

loginErr.textContent=
"Login works, but your profile is not linked. Contact an admin.";

loginErr.classList.remove("hidden");

return;

}


profile=p.data;

login.classList.add("hidden");

app.classList.remove("hidden");

account.textContent=
profile.full_name+" · "+profile.role;


if(profile.role==="admin")
adminBtn.classList.remove("hidden");


await load();

render();

}


/* LOAD DATA */

async function load(){

/* CORE DATA — Events/Announcements must not break the main app */

let [s,c,a]=await Promise.all([

sb.from("subjects")
.select("*")
.order("name"),

sb.from("classes")
.select("*,subjects(name,credits)")
.order("class_date")
.order("start_time"),

sb.from("attendance")
.select("*")
.eq("student_id",me.id)

]);

if(s.error||c.error||a.error){

console.log("CORE DATA ERROR",s.error,c.error,a.error);

alert((s.error||c.error||a.error).message);

return;

}

subjects=s.data||[];
classes=c.data||[];
mine=a.data||[];


/* EVENTS */

let e=await sb.from("events")
.select("*")
.order("event_date");

if(e.error){

console.log("EVENTS ERROR",e.error);
eventsData=[];

}else{

eventsData=e.data||[];

}


/* ANNOUNCEMENTS */

let n=await sb.from("announcements")
.select("*")
.order("created_at",{ascending:false});

if(n.error){

console.log("ANNOUNCEMENTS ERROR",n.error);
announcementsData=[];

}else{

announcementsData=n.data||[];

}


/* ADMIN PROFILES */

if(profile.role==="admin"){

let p=await sb.from("profiles")
.select("id,student_id,full_name,email,role")
.order("student_id");

if(p.error){

console.log("PROFILES ERROR",p.error);
profiles=[];

}else{

profiles=p.data||[];

}

}

}

/* TABS */

function tab(x){

[
"dash",
"today",
"attendance",
"events",
"announcements",
"admin"
].forEach(y=>{

document.getElementById(y)
.classList.toggle("hidden",x!==y);

});


document.querySelectorAll(".tabs button")
.forEach(b=>b.classList.remove("active"));


if(x==="dash")
dashBtn.classList.add("active");


if(x==="admin")
renderAdmin();

}


/* RENDER EVERYTHING */

function render(){

welcome.innerHTML=
'<div class="row">'+
'<div>'+
'<h2 style="margin:0">Hi, '+
esc(profile.full_name.split(" ")[0])+
' 👋</h2>'+
'<div class="muted">'+
esc(profile.student_id)+
' · '+
esc(profile.email)+
'</div>'+
'</div>'+
'<b>'+
profile.role.toUpperCase()+
'</b>'+
'</div>';


renderDash();
renderToday();
renderAttendance();
renderEvents();
renderAnnouncements();


if(profile.role==="admin")
renderAdmin();

}


/* DASHBOARD */

function renderDash(){

let cards=subjects.map(s=>{

let cs=classes.filter(
c=>c.subject_id===s.id
);

let p=cs.filter(
c=>att(c.id)?.status==="present"
).length;

let a=cs.filter(
c=>att(c.id)?.status==="absent"
).length;

let allow=s.skip_allowance??s.credits;

return '<div class="card">'+
'<b>'+esc(s.name)+'</b>'+
'<div class="muted">'+s.credits+' credits</div>'+
'<div class="stat">'+p+'/'+(p+a)+'</div>'+
'<div class="muted">'+
Math.max(0,allow-a)+
' skip(s) remaining'+
'</div>'+
'</div>';

}).join("");


let activeAnnouncements=
announcementsData.filter(a=>a.active);


let announcementHtml=
activeAnnouncements.length
?
'<h3>📢 Announcements</h3>'+
activeAnnouncements.slice(0,3).map(a=>
'<div class="announcement">'+
'<b>'+esc(a.title)+'</b>'+
'<p>'+esc(a.body)+'</p>'+
'</div>'
).join("")
:
'';


dash.innerHTML=
'<h3>My attendance</h3>'+
'<div class="grid">'+
cards+
'</div>'+
announcementHtml;

}


/* TODAY */

function classCard(c){

let a=att(c.id);

let st=a?.status;

return '<div class="class '+(st||"")+'">'+

'<div class="row">'+

'<div>'+

'<div class="time">'+
c.class_date+
' · '+
c.start_time.slice(0,5)+
'–'+
c.end_time.slice(0,5)+
'</div>'+

'<b>'+
esc(c.subjects?.name||"Class")+
'</b>'+

'<div class="muted">'+
'Room: '+
esc(c.room||"—")+
' · Session '+
(c.session_number||"—")+
'</div>'+

(st?
'<div class="status '+
(st==="present"?"ok":"bad")+
'">'+
st.toUpperCase()+
'</div>'
:"")+

'</div>'+

'<button class="'+
(st?"ghost":"primary")+
'" onclick="mark(\''+
c.id+
'\',\''+
(st==="present"?"absent":"present")+
'\')">'+

(st==="present"?
"Mark absent":
"I attended")+

'</button>'+

'</div>'+
'</div>';

}


function renderToday(){

const panel=document.getElementById("today");

const d=new Date(selectedClassDate);

const dateString=
d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");

const now=new Date();

const todayString=
now.getFullYear()+"-"+
String(now.getMonth()+1).padStart(2,"0")+"-"+
String(now.getDate()).padStart(2,"0");

const isToday=dateString===todayString;

const displayDate=d.toLocaleDateString("en-IN",{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
});

const dayClasses=classes.filter(
c=>String(c.class_date).slice(0,10)===dateString
);

panel.innerHTML=

'<div class="card">'+

'<div class="row">'+

'<button class="ghost" onclick="changeClassDay(-1)">← Previous Day</button>'+

'<div style="text-align:center">'+
'<h3 style="margin:0">'+
(isToday?"Today":"Classes")+
'</h3>'+
'<div class="muted">'+
displayDate+
'</div>'+
'</div>'+

'<button class="ghost" onclick="changeClassDay(1)">Next Day →</button>'+

'</div>'+

'<div style="text-align:center;margin-top:12px">'+
'<button class="small primary" onclick="goToToday()">Today</button>'+
'</div>'+

'</div>'+

(
dayClasses.length
?
dayClasses.map(classCard).join("")
:
'<div class="card"><b>No scheduled classes on this day.</b></div>'
);

}


function changeClassDay(offset){

const d=new Date(selectedClassDate);

d.setDate(
d.getDate()+offset
);

selectedClassDate=d;

renderToday();

}


function goToToday(){

selectedClassDate=new Date();

renderToday();

}



/* ATTENDANCE */

function renderAttendance(){

let rows=subjects.map(s=>{

let cs=classes.filter(
c=>c.subject_id===s.id
);

let p=cs.filter(
c=>att(c.id)?.status==="present"
).length;

let a=cs.filter(
c=>att(c.id)?.status==="absent"
).length;


return '<tr>'+
'<td><b>'+esc(s.name)+'</b></td>'+
'<td>'+p+'</td>'+
'<td>'+a+'</td>'+
'<td>'+
((p+a)?
Math.round(p/(p+a)*100):0)+
'%</td>'+
'<td>'+
Math.max(
0,
(s.skip_allowance??s.credits)-a
)+
'</td>'+
'</tr>';

}).join("");


attendance.innerHTML=
'<h3>My attendance summary</h3>'+
'<div class="tablewrap">'+
'<table>'+
'<thead><tr>'+
'<th>Subject</th>'+
'<th>Present</th>'+
'<th>Absent</th>'+
'<th>%</th>'+
'<th>Skips left</th>'+
'</tr></thead>'+
'<tbody>'+
rows+
'</tbody>'+
'</table>'+
'</div>'+

'<h3 style="margin-top:24px">Batch attendance</h3>'+
'<div id="batch" class="card">Loading…</div>';


loadBatch();

}


async function loadBatch(){

let q=await sb.from("batch_attendance")
.select("*")
.order("student_id");


if(q.error){

batch.innerHTML=
'<div class="notice">'+
'Batch attendance could not be loaded.'+
'</div>';

return;

}


let g={};

(q.data||[]).forEach(
r=>(g[r.student_id]??=[]).push(r)
);


let rows=Object.entries(g).map(
([id,rs])=>{

let p=rs.filter(
x=>x.status==="present"
).length;

let a=rs.filter(
x=>x.status==="absent"
).length;

let pc=p+a?
Math.round(p/(p+a)*100):0;


return '<tr>'+
'<td>'+esc(id)+'</td>'+
'<td>'+esc(rs[0].full_name)+'</td>'+
'<td>'+p+'</td>'+
'<td>'+a+'</td>'+
'<td>'+pc+'%</td>'+
'</tr>';

}).join("");


batch.innerHTML=
'<div class="tablewrap">'+
'<table>'+
'<thead><tr>'+
'<th>ID</th>'+
'<th>Student</th>'+
'<th>Present</th>'+
'<th>Absent</th>'+
'<th>%</th>'+
'</tr></thead>'+
'<tbody>'+
rows+
'</tbody>'+
'</table>'+
'</div>';

}


/* ATTENDANCE MARK */

async function mark(classId,status){

let q=await sb.from("attendance")
.upsert({

student_id:me.id,
class_id:classId,
status:status,
marked_at:new Date().toISOString()

},{onConflict:"student_id,class_id"});


if(q.error){

alert(q.error.message);

return;

}


await load();

render();

tab("today");

}


/* EVENTS FOR STUDENTS */

function renderEvents(){

let sorted=[...eventsData]
.sort((a,b)=>
String(a.event_date).localeCompare(
String(b.event_date)
));


events.innerHTML=
'<h3>🗓️ Events & Holidays</h3>'+
(
sorted.length
?
sorted.map(e=>
'<div class="event">'+

'<div class="row">'+

'<div>'+
'<span class="badge">'+
esc(e.event_type||"Event")+
'</span>'+

'<h3 style="margin:8px 0">'+
esc(e.title)+
'</h3>'+

'<div class="muted">'+
esc(e.event_date)+
'</div>'+

(e.description?
'<p>'+esc(e.description)+'</p>':
"")+

'</div>'+

'</div>'+

'</div>'
).join("")
:
'<div class="card">No events or holidays added yet.</div>'
);

}


/* ANNOUNCEMENTS FOR STUDENTS */

function renderAnnouncements(){

let active=announcementsData
.filter(a=>a.active);


announcements.innerHTML=
'<h3>📢 Announcements</h3>'+
(
active.length
?
active.map(a=>
'<div class="announcement">'+
'<h3 style="margin:0 0 8px">'+
esc(a.title)+
'</h3>'+
'<p>'+
esc(a.body)+
'</p>'+
'<div class="muted">'+
new Date(a.created_at).toLocaleString()+
'</div>'+
'</div>'
).join("")
:
'<div class="card">No active announcements.</div>'
);

}


/* =========================================
   ADMIN
========================================= */

function renderAdmin(){

admin.innerHTML=

'<h2>Admin Panel</h2>'+
'<p class="muted">Manage students, subjects, timetable, attendance, events and announcements.</p>'+

'<div class="adminnav">'+

adminButton("students","Students")+
adminButton("subjects","Subjects")+
adminButton("classes","Timetable")+
adminButton("attendance","Attendance")+
adminButton("events","Events")+
adminButton("announcements","Announcements")+

'</div>'+

'<div id="adminContent"></div>';


if(adminSection==="students")
renderAdminStudents();

if(adminSection==="subjects")
renderAdminSubjects();

if(adminSection==="classes")
renderAdminClasses();

if(adminSection==="attendance")
renderAdminAttendance();

if(adminSection==="events")
renderAdminEvents();

if(adminSection==="announcements")
renderAdminAnnouncements();

}


function adminButton(id,label){

return '<button class="'+
(adminSection===id?"active":"")+
'" onclick="adminSection=\''+
id+
'\';renderAdmin()">'+
label+
'</button>';

}


/* STUDENTS */

function renderAdminStudents(){

document.getElementById("adminContent").innerHTML=

'<div class="card">'+

'<h3>Batch Students</h3>'+

'<p class="muted">'+
profiles.length+
' registered profiles.'+
'</p>'+

'<div class="tablewrap">'+
'<table>'+
'<thead><tr>'+
'<th>ID</th>'+
'<th>Name</th>'+
'<th>Email</th>'+
'<th>Role</th>'+
'<th>Action</th>'+
'</tr></thead>'+
'<tbody>'+

profiles.map(p=>

'<tr>'+
'<td>'+esc(p.student_id)+'</td>'+
'<td>'+esc(p.full_name)+'</td>'+
'<td>'+esc(p.email)+'</td>'+
'<td>'+
'<select id="role_'+p.id+'">'+
'<option value="student" '+
(p.role==="student"?"selected":"")+
'>Student</option>'+
'<option value="admin" '+
(p.role==="admin"?"selected":"")+
'>Admin</option>'+
'</select>'+
'</td>'+
'<td>'+
'<button class="small primary" onclick="changeRole(\''+
p.id+
'\')">Save</button>'+
'</td>'+
'</tr>'

).join("")+

'</tbody>'+
'</table>'+
'</div>'+
'</div>';

}


async function changeRole(id){

let value=
document.getElementById("role_"+id).value;


if(!confirm(
"Change this user's role to "+value+"?"
))
return;


let q=await sb.from("profiles")
.update({role:value})
.eq("id",id);


if(q.error){

alert(q.error.message);

return;

}


alert("Role updated successfully.");

await load();

renderAdmin();

}


/* SUBJECTS */

function renderAdminSubjects(){

document.getElementById("adminContent").innerHTML=

'<div class="card">'+

'<h3>Add Subject</h3>'+

'<div class="formgrid">'+

'<div class="field">'+
'<label>Subject name</label>'+
'<input id="newSubName" placeholder="Example: Generative AI">'+
'</div>'+

'<div class="field">'+
'<label>Credits</label>'+
'<input id="newSubCredits" type="number" min="1" value="3">'+
'</div>'+

'<div class="field">'+
'<label>Skip allowance</label>'+
'<input id="newSubSkip" type="number" min="0" value="3">'+
'</div>'+

'</div>'+

'<button class="primary" onclick="addSubject()">Add subject</button>'+

'</div>'+

'<div class="card section">'+

'<h3>Existing Subjects</h3>'+

'<div class="tablewrap">'+
'<table>'+
'<thead><tr>'+
'<th>Subject</th>'+
'<th>Credits</th>'+
'<th>Skip allowance</th>'+
'<th>Action</th>'+
'</tr></thead>'+

'<tbody>'+

subjects.map(s=>

'<tr>'+
'<td>'+esc(s.name)+'</td>'+

.value.trim();
